<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Lumiu — Smart reminders that actually work. Coming soon.">
  <title>Lumiu — Coming Soon</title>
  <link rel="stylesheet" href="styles.css">
  <!-- Favicon placeholder — replace with your actual favicon -->
  <!-- <link rel="icon" type="image/png" href="assets/favicon.png"> -->
</head>
<body>

  <!-- ── Header ── -->
<div id="site-header"></div>

  <!-- ── Main ── -->
  <main>
    <section class="coming-soon">
      <div class="coming-soon-inner">

        <span class="coming-soon-eyebrow">Coming soon</span>

        <h1 class="coming-soon-title">
          Remember<br><em>everything.</em>
        </h1>

        <p class="coming-soon-desc">
          Lumiu is a reminders app built around the way you actually think —
          flexible schedules, zero clutter, and push notifications that arrive
          exactly when you need them.
        </p>

        <!-- Notify form — wire this up to your email service when ready -->
        <form class="notify-form" onsubmit="handleNotify(event)">
          <input
            type="email"
            class="notify-input"
            placeholder="Your email address"
            aria-label="Email address for early access"
            required
          >
          <button type="submit" class="notify-btn">Notify me</button>
        </form>

        <div class="coming-soon-features">
          <span class="feature-pill">Smart scheduling</span>
          <span class="feature-pill">Repeat on any day</span>
          <span class="feature-pill">iOS &amp; Android</span>
        </div>

      </div>
    </section>
  </main>

  <!-- ── Footer ── -->
<div id="site-footer"></div>

  <script>
      fetch('header.html')
    .then(r => r.text())
    .then(html => document.getElementById('site-header').innerHTML = html);
    
    fetch('footer.html')
    .then(r => r.text())
    .then(html => document.getElementById('site-footer').innerHTML = html);

    function handleNotify(e) {
      e.preventDefault();
      const btn = e.target.querySelector('button');
      btn.textContent = 'You\'re on the list ✓';
      btn.disabled = true;
      btn.style.background = '#3a3732';
      // TODO: connect to your email service (Mailchimp, Resend, etc.)
    }
  </script>

</body>
</html>
